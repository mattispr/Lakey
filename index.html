<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
				
    display: flex;
    align-items: center;
    justify-content: center;

    font-family: 'Segoe UI', Arial, sans-serif;

 }

 body::before {
     content: "";
     position: fixed;
     inset: 0;

     background-image: url('barrel-desktop.jpg');
     background-size: cover;
     background-position: center 25%;
     background-repeat: no-repeat;

     z-index: -1;

  }
  .container {
    text-align: center;
    color: #ffffff;
  }
  .title {
    font-size: 1.5rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #ffffff;
    margin-bottom: 30px;
  }
  .timer {
    display: flex;
    gap: 30px;
    justify-content: center;
  }
  .unit {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .value {
    font-size: 4.5rem;
    font-weight: 700;
    width: 110px;
    height: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(71, 85, 105, 0.75);
    border-radius: 12px;
  }
  .colon {
    font-size: 4.5rem;
    font-weight: 700;
    color: #ffffff;
    display: flex;
    align-items: center;
  }
  .done {
    font-size: 2.5rem;
    font-weight: 700;
    color: #ffffff;
  }
  @media (max-width: 768px) and (orientation: portrait) {
      body::before {
          background-image: url("barrel-mobile.jpg");
	  }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="title">Lakey wir kommen 🔥🔥🔥</div>
    <div class="timer" id="timer">
      <div class="unit">
        <div class="value" id="days">00</div>
      </div>
      <div class="colon">:</div>
      <div class="unit">
        <div class="value" id="hours">00</div>
      </div>
      <div class="colon">:</div>
      <div class="unit">
        <div class="value" id="minutes">00</div>
      </div>
      <div class="colon">:</div>
      <div class="unit">
        <div class="value" id="seconds">00</div>
      </div>
    </div>
  </div>

<script>
  function getTargetDate() {
    const now = new Date();
    let year = now.getFullYear();
    let target = new Date(year, 7, 15, 15, 25, 0); // Monat 7 = August (0-indexiert)
    if (target.getTime() < now.getTime()) {
      target = new Date(year + 1, 7, 15, 15, 25, 0);
    }
    return target;
  }

  const target = getTargetDate();

  function updateTimer() {
    const now = new Date();
    const diff = target - now;

    if (diff <= 0) {
      document.getElementById('timer').innerHTML = '<div class="done">Es ist soweit!</div>';
      clearInterval(interval);
      return;
    }

    const totalSeconds = Math.floor(diff / 1000);
    const days = Math.floor(totalSeconds / 86400);
    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    document.getElementById('days').textContent = String(days).padStart(2, '0');
    document.getElementById('hours').textContent = String(hours).padStart(2, '0');
    document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
    document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
  }

  updateTimer();
  const interval = setInterval(updateTimer, 1000);
</script>
</body>
</html>
